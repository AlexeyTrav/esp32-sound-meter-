; Copy to config.ini and fill in. Do NOT put the password here:
; the script asks for it (or reads the SMTP_PASSWORD environment variable).

[smtp]
; Office 365: smtp.office365.com 587 | Gmail: smtp.gmail.com 587 (needs an App Password)
host = smtp.office365.com
port = 587
user = guestservices@yourhotel.com
; pause between emails, seconds (keeps you under provider limits)
delay_seconds = 2

[email]
from_name = Medicine Hat Lodge
from_address = guestservices@yourhotel.com
reply_to = guestservices@yourhotel.com
subject = {first_name}, how was your stay at {name}?
; {email}, {first_name}, {last_name}, {arrival}, {departure} can be used in the link
survey_link = https://tally.so/r/XXXXXX?email={email}&departure={departure}

[hotel]
; used in the email footer (CASL: sender name, mailing address and contact are required)
name = Medicine Hat Lodge
address = 123 Your Street, Medicine Hat, AB T1A 0A0
phone = +1 (403) 000-0000
contact_email = guestservices@yourhotel.com
